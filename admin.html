<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Control Panel</title>
<style>
  :root {
    --accent: #ff4f79;
    --accent-dark: #d9365d;
    --bg: #fff3f7;
  }
  body { 
    font-family: Arial, sans-serif; 
    background: var(--bg); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
  }
  .card { 
    background: #fff; 
    padding: 24px; 
    border-radius: 16px; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.12); 
    width: 90%; 
    max-width: 360px; 
    text-align: center; 
    box-sizing: border-box;
  }
  h2 { color: var(--accent-dark); margin-top: 0; font-size: 20px; }
  
  /* Current Number Box */
  .status-box {
    background: #e8f5e9;
    border: 1px solid #a5d6a7;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 15px;
  }
  .status-title { font-size: 11px; color: #2e7d32; font-weight: bold; text-transform: uppercase; }
  .current-num { font-size: 18px; color: #1b5e20; font-weight: bold; margin-top: 2px; }

  /* Input & Guide Box */
  input { 
    width: 100%; 
    padding: 11px; 
    margin-bottom: 6px; 
    border: 1px solid #ddd; 
    border-radius: 8px; 
    box-sizing: border-box; 
    font-size: 14px; 
    outline: none;
    transition: 0.3s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 6px rgba(255,79,121,0.3); }

  .guide-text {
    font-size: 11px;
    color: #d9365d;
    background: #ffe3ea;
    padding: 8px;
    border-radius: 6px;
    text-align: left;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  button { 
    width: 100%; 
    padding: 12px; 
    background: linear-gradient(90deg, var(--accent), var(--accent-dark)); 
    color: white; 
    border: none; 
    border-radius: 8px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 14px; 
    box-shadow: 0 4px 8px rgba(217,54,93,0.3);
  }
  button:active { transform: scale(0.98); }

  .msg { margin-top: 10px; font-weight: bold; font-size: 12px; }
  #adminContent { display: none; }
</style>
</head>
<body>

<div class="card">
  <!-- 1. Password Protection Area -->
  <div id="loginBox">
    <h2>🔐 Admin Login</h2>
    <p style="font-size:12px; color:#666; margin-bottom:15px;">पैनल खोलने के लिए पासवर्ड दर्ज करें</p>
    
    <!-- Placeholder se Password Hata Diya Gaya Hai -->
    <input type="password" id="passInput" placeholder="Enter Password">
    
    <button onclick="checkPassword()">Login Panel</button>
    <div id="loginMsg" class="msg" style="color:red;"></div>
  </div>

  <!-- 2. Main Admin Controls -->
  <div id="adminContent">
    <h2>⚙️ WhatsApp Number Change</h2>

    <!-- Shows Currently Active Number -->
    <div class="status-box">
      <div class="status-title">🟢 Active WhatsApp Number</div>
      <div class="current-num" id="currentNumDisplay">+91 Loading...</div>
    </div>

    <!-- Input for New Number -->
    <input type="tel" id="newNumberInput" placeholder="New WhatsApp Number" maxlength="12">
    
    <!-- Guideline Text -->
    <div class="guide-text">
      📌 <b>नंबर दर्ज करने की गाइडलाइन:</b><br>
      • नंबर के आगे <b>91</b> लगाकर डालें (उदा: <code>919576714697</code>)<br>
      • अगर आप सिर्फ 10 अंक डालेंगे तो प्रणाली अपने आप आगे 91 जोड़ देगी।
    </div>

    <button onclick="updateNumber()">Save & Update Number</button>
    <div id="saveMsg" class="msg"></div>
  </div>
</div>

<script>
// डिफॉल्ट बैकअप नंबर
const DEFAULT_NUMBER = "917857807380";

// पासवर्ड चेक करने का फंक्शन (Password: 112233)
function checkPassword(){
  const pass = document.getElementById("passInput").value;
  if(pass === "112233"){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminContent").style.display = "block";
    loadCurrentNumber();
  } else {
    // Galat password par sirf alert dikhega, sahi password reveal nahi hoga
    document.getElementById("loginMsg").textContent = "❌ गलत पासवर्ड! फिर से प्रयास करें।";
  }
}

// स्टोरेज से एक्टिव नंबर लोडिंग फंक्शन
function loadCurrentNumber(){
  let num = localStorage.getItem("whatsapp_number") || DEFAULT_NUMBER;
  document.getElementById("currentNumDisplay").textContent = "+" + num;
}

// नया नंबर सेव करने का स्मार्ट फंक्शन
function updateNumber(){
  let rawNum = document.getElementById("newNumberInput").value.trim().replace(/[^0-9]/g, '');
  let saveMsg = document.getElementById("saveMsg");

  // अगर 10 अंक डाले हैं तो आगे '91' जोड़ दें
  if (rawNum.length === 10) {
    rawNum = "91" + rawNum;
  }

  // चेकिंग कि नंबर 12 डिजिट का सही '91...' फॉर्मेट में है या नहीं
  if (rawNum.length === 12 && rawNum.startsWith("91")) {
    localStorage.setItem("whatsapp_number", rawNum);
    loadCurrentNumber();
    
    saveMsg.style.color = "green";
    saveMsg.innerHTML = "✅ WhatsApp नंबर अपडेट हो गया!<br>(" + rawNum + ")";
    document.getElementById("newNumberInput").value = "";
  } else {
    saveMsg.style.color = "red";
    saveMsg.textContent = "⚠️ कृपया सही 10 अंक या 91 लगाकर 12 अंक दर्ज करें!";
  }
}
</script>

</body>
</html>
